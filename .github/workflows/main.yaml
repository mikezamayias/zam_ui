name: Manual self-hosted CI

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zam-ui-manual-default-branch
  cancel-in-progress: false

jobs:
  verify:
    name: Verify protected default branch
    runs-on: [self-hosted, macOS, ARM64, zam-ui-manual]
    timeout-minutes: 90

    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      - name: Assert protected default-branch event
        shell: bash
        env:
          DEFAULT_BRANCH: main
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_PROTECTED: ${{ github.ref_protected }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = "workflow_dispatch"
          test "$EVENT_DEFAULT_BRANCH" = "$DEFAULT_BRANCH"
          test "$EVENT_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$EVENT_REF_NAME" = "$DEFAULT_BRANCH"
          test "$EVENT_REF_PROTECTED" = "true"
          case "$WORKFLOW_REF" in
            *@refs/heads/$DEFAULT_BRANCH) ;;
            *) echo "Workflow code is not from the protected default branch." >&2; exit 1 ;;
          esac
          test "${#EVENT_SHA}" -eq 40
          case "$EVENT_SHA" in
            *[!0-9a-f]*) echo "Event SHA is not an immutable Git commit SHA." >&2; exit 1 ;;
          esac

      - name: Checkout event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify checked-out identity
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test "$(git rev-parse --is-inside-work-tree)" = "true"

      - name: Prepare isolated runtime
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/zam-ui-manual-$RUN_ID-$RUN_ATTEMPT"
          pub_cache="$root/pub-cache"
          xdg_cache="$root/xdg-cache"
          temp="$root/tmp"
          case "$root" in
            "$RUNNER_TEMP"/zam-ui-manual-*) ;;
            *) echo "Unsafe isolated runtime path." >&2; exit 1 ;;
          esac
          mkdir -p "$pub_cache" "$xdg_cache" "$temp"
          {
            echo "ZAM_CI_ROOT=$root"
            echo "PUB_CACHE=$pub_cache"
            echo "XDG_CACHE_HOME=$xdg_cache"
            echo "TMPDIR=$temp"
          } >> "$GITHUB_ENV"

      - name: Verify exact toolchain
        run: ruby scripts/verify_toolchain.rb .github/toolchain.json

      - name: Verify workflow policy
        run: ruby test/workflow_policy_test.rb

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis
        run: flutter analyze

      - name: Run design token audit
        run: |
          dart run scripts/check_design_tokens.dart --self-test
          dart run scripts/check_design_tokens.dart

      - name: Run unit and widget tests
        run: flutter test --coverage

      - name: Clean isolated runtime
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ZAM_CI_ROOT" in
            "$RUNNER_TEMP"/zam-ui-manual-*) ;;
            *) echo "Refusing unsafe cleanup path." >&2; exit 1 ;;
          esac
          test ! -L "$ZAM_CI_ROOT"
          rm -rf -- "$ZAM_CI_ROOT" .dart_tool build coverage pubspec.lock
